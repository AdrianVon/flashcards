<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Flashcards | Adrian's Study Hub</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root {
--bg: #ffffff;
--surface: #f8fafc;
--surface2: #eef2f7;
--border: #cbd5e1;
--text: #0f172a;
--text2: #64748b;
--accent: #2563eb;
--accent2: #1d4ed8;
--green: #16a34a;
--red: #dc2626;
--yellow: #d97706;
--orange: #ea580c;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }

/* Card flip */
.card-container { perspective: 1000px; width: 100%; max-width: 560px; height: 340px; cursor: pointer; margin: 0 auto; }
.card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.5s cubic-bezier(0.4,0,0.2,1); transform-style: preserve-3d; }
.card-inner.flipped { transform: rotateY(180deg); }
.card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px; text-align: center; font-size: 1.25rem; line-height: 1.6; }
.card-front { background: linear-gradient(135deg, #2563eb, #3b82f6); color: white; }
.card-back { background: linear-gradient(135deg, #16a34a, #22c55e); color: white; transform: rotateY(180deg); }
.card-label { position: absolute; top: 16px; left: 20px; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 2px; opacity: 0.7; }
.card-number { position: absolute; top: 16px; right: 20px; font-size: 0.75rem; opacity: 0.7; }

/* Card-to-card slide transition (whole card slides out left, next slides in
   from the right) -- separate from the flip transform above, which only
   ever applies to .card-inner. */
.card-slide-wrap { position: relative; transition: transform 0.32s cubic-bezier(0.4,0,0.2,1), opacity 0.32s ease; }
.card-slide-wrap.card-exit { transform: translateX(-110%) rotate(-6deg); opacity: 0; }
.card-slide-wrap.card-enter-start { transition: none !important; transform: translateX(110%) rotate(6deg); opacity: 0; }

/* Fun grade feedback popup: a random checkmark/emoji + message that pops
   over the card and lingers for a few seconds when you get one right --
   lives outside .card-slide-wrap (see StudyScreen) so it stays put on
   screen while the card underneath slides out and the next one slides in,
   and its own lifecycle (see FEEDBACK_DURATION_MS) is independent of the
   card transition timing. */
.grade-feedback { position: absolute; top: 50%; left: 50%; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; z-index: 20; animation: gradePop 1.6s cubic-bezier(0.34,1.56,0.64,1) forwards; }
.grade-feedback-icon { font-size: 4.5rem; filter: drop-shadow(0 6px 14px rgba(0,0,0,0.3)); }
.grade-feedback-text { font-size: 1.05rem; font-weight: 800; color: white; text-shadow: 0 2px 6px rgba(0,0,0,0.4); background: rgba(0,0,0,0.25); padding: 4px 16px; border-radius: 999px; white-space: nowrap; }
@keyframes gradePop {
0% { transform: translate(-50%,-50%) scale(0.3) rotate(-10deg); opacity: 0; }
8% { transform: translate(-50%,-50%) scale(1.2) rotate(5deg); opacity: 1; }
15% { transform: translate(-50%,-50%) scale(1) rotate(0deg); opacity: 1; }
85% { transform: translate(-50%,-50%) scale(1) rotate(0deg); opacity: 1; }
100% { transform: translate(-50%,-50%) scale(0.85) translateY(-24px); opacity: 0; }
}

/* Swipe */
.card-container { touch-action: pan-y; user-select: none; }

/* Buttons */
.btn { padding: 10px 20px; border-radius: 10px; border: none; font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: all 0.15s; display: inline-flex; align-items: center; gap: 8px; }
.btn:hover { transform: translateY(-1px); filter: brightness(1.1); }
.btn:active { transform: translateY(0); }
.btn-accent { background: var(--accent); color: white; }
.btn-green { background: var(--green); color: white; }
.btn-red { background: var(--red); color: white; }
.btn-surface { background: var(--surface2); color: var(--text); }
.btn-outline { background: transparent; border: 1.5px solid var(--border); color: var(--text2); }
.btn-outline:hover { border-color: var(--accent); color: var(--accent2); }
.btn-sm { padding: 6px 14px; font-size: 0.8rem; }
.btn-lg { padding: 14px 28px; font-size: 1rem; }

/* Progress bar */
.progress-bar { width: 100%; height: 6px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }

/* Input */
.input { width: 100%; padding: 10px 14px; background: var(--surface); border: 1.5px solid var(--border); border-radius: 10px; color: var(--text); font-size: 0.9rem; outline: none; transition: border-color 0.15s; }
.input:focus { border-color: var(--accent); }
.textarea { resize: vertical; min-height: 80px; font-family: inherit; }

/* Nav */
.nav { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; border-bottom: 1px solid var(--surface2); background: var(--surface); }
.nav-title { font-size: 1.1rem; font-weight: 700; }

/* Animations */
@keyframes slideIn { from { opacity:0; transform: translateY(20px); } to { opacity:1; transform: translateY(0); } }
.animate-in { animation: slideIn 0.3s ease-out; }
@keyframes fadeIn { from { opacity:0; } to { opacity:1; } }

/* Quiz */
.quiz-option { width: 100%; padding: 14px 18px; background: var(--surface); border: 1.5px solid var(--border); border-radius: 12px; color: var(--text); font-size: 0.95rem; cursor: pointer; transition: all 0.15s; text-align: left; }
.quiz-option:hover { border-color: var(--accent); background: var(--surface2); }
.quiz-option.correct { border-color: var(--green); background: rgba(34,197,94,0.15); }
.quiz-option.wrong { border-color: var(--red); background: rgba(239,68,68,0.15); }

/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 3px; }

/* Modal */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 100; animation: fadeIn 0.2s; }
.modal { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 28px; width: 90%; max-width: 480px; max-height: 80vh; overflow-y: auto; }

/* Loading spinner */
.spinner { display: inline-block; width: 20px; height: 20px; border: 2.5px solid var(--surface2); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Auth */
.auth-pill { display:flex; align-items:center; gap:8px; }
.avatar-badge { display:flex; align-items:center; justify-content:center; width:22px; height:22px; border-radius:999px; background: var(--surface2); color: var(--text); font-size:0.7rem; font-weight:700; }
.admin-tag { font-size:0.65rem; font-weight:700; text-transform:uppercase; letter-spacing:1px; background: var(--accent); color:white; border-radius:6px; padding:2px 6px; }

@media (max-width: 640px) {
.card-container { height: 280px; }
.card-face { font-size: 1.05rem; padding: 24px; }
.nav { padding: 12px 16px; }
}

/* Admin list rows (cards + sets) -- on phone there isn't room for
   inline text + a set dropdown + Edit + Delete all on one line, so the
   text was getting squeezed down to 2-3 visible characters. Below
   560px the row stacks: full-width text on top, controls below. */
.admin-item { display:flex; align-items:center; gap:12px; background: var(--surface); border:1px solid var(--surface2); border-radius:12px; padding:14px 18px; }
.admin-item-main { flex:1; min-width:0; }
.admin-item-title { font-size:0.9rem; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.admin-item-sub { font-size:0.8rem; color:var(--text2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.admin-item-controls { display:flex; align-items:center; gap:8px; flex-shrink:0; }
.admin-item-controls select.input { width:auto; max-width:140px; font-size:0.75rem; padding:6px 10px; }

@media (max-width: 560px) {
.admin-item { flex-direction: column; align-items: stretch; }
.admin-item-title, .admin-item-sub { white-space: normal; overflow: visible; text-overflow: clip; }
.admin-item-controls { flex-wrap: wrap; width: 100%; }
.admin-item-controls select.input { max-width: none; flex: 1 1 auto; }
.admin-item-controls .btn { flex: 1; }
.action-bar { flex-direction: column; align-items: stretch; }
.action-bar select.input { width: 100% !important; margin-left: 0 !important; }
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useMemo, useRef } = React;

// ============================================================
// SUPABASE CONFIG
// ============================================================
const SUPABASE_URL = "https://pfvbfpyxchglxveyjsge.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_eOZHAg_c0og_G5I0VIM60g_bc8ziADW";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ============================================================
// SUPABASE HELPERS - cards
// ============================================================
async function fetchCards() {
const { data, error } = await supabase
.from("flashcards")
.select("*")
.order("id", { ascending: true });
if (error) { console.error("Error fetching cards:", error); return []; }
return data || [];
}

async function insertCard(front, back, tags = [], imageUrl = null) {
const { data, error } = await supabase
.from("flashcards")
.insert([{ front, back, tags, image_url: imageUrl }])
.select();
if (error) { console.error("Error inserting card:", error); return null; }
return data?.[0] || null;
}

async function updateCard(id, front, back) {
const { error } = await supabase
.from("flashcards")
.update({ front, back })
.eq("id", id);
if (error) { console.error("Error updating card:", error); return false; }
return true;
}

async function updateCardImage(id, imageUrl) {
const { error } = await supabase
.from("flashcards")
.update({ image_url: imageUrl })
.eq("id", id);
if (error) { console.error("Error updating card image:", error); return false; }
return true;
}

// Uploads an image to the public flashcard-images bucket (admin-only, per
// storage RLS policies) and returns its public URL, or null on failure.
async function uploadCardImage(file) {
const ext = (file.name.split('.').pop() || 'png').toLowerCase().replace(/[^a-z0-9]/g, '') || 'png';
const path = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
const { error } = await supabase.storage.from("flashcard-images").upload(path, file, {
cacheControl: "3600",
upsert: false,
});
if (error) { console.error("Error uploading image:", error); return null; }
const { data } = supabase.storage.from("flashcard-images").getPublicUrl(path);
return data?.publicUrl || null;
}

async function deleteCardFromDB(id) {
const { error } = await supabase
.from("flashcards")
.delete()
.eq("id", id);
if (error) { console.error("Error deleting card:", error); return false; }
return true;
}

async function importCardsToDB(cardsArray) {
const { data, error } = await supabase
.from("flashcards")
.insert(cardsArray.map(c => ({ front: c.front, back: c.back, tags: c.tags || [] })))
.select();
if (error) { console.error("Error importing cards:", error); return []; }
return data || [];
}

async function updateCardSet(id, setId) {
const { error } = await supabase
.from("flashcards")
.update({ set_id: setId })

if (error) { console.error("Error moving card to set:", error); return false; }
return true;
}

// ============================================================
// SUPABASE HELPERS - sets
// ============================================================
async function fetchSets() {
const { data, error } = await supabase
.from("flashcard_sets")
.select("*")
.order("created_at", { ascending: true });
if (error) { console.error("Error fetching sets:", error); return []; }
return data || [];
}

async function insertSet(name, description) {

if (error) { console.error("Error creating set:", error); return null; }
return data?.[0] || null;
}

async function updateSet(id, name, description) {
const { error } = await supabase
.from("flashcard_sets")
.update({ name, description: description || null })

if (error) { console.error("Error updating set:", error); return false; }
return true;
}

async function deleteSetFromDB(id) {
const { error } = await supabase
.from("flashcard_sets")
.delete()
.eq("id", id);
if (error) { console.error("Error deleting set:", error); return false; }

}

// ============================================================
// SUPABASE HELPERS - test (quiz) attempt history, per set
// ============================================================
async function fetchTestAttempts(userId, setId) {
const { data, error } = await supabase
.from("flashcard_test_attempts")
.select("*")
.eq("user_id", userId)
.eq("set_id", setId)
.order("taken_at", { ascending: false });
if (error) { console.error("Error fetching test attempts:", error); return []; }
return data || [];
}

async function insertTestAttempt(userId, setId, score, total) {
const { data, error } = await supabase

if (error) { console.error("Error saving test attempt:", error); return null; }

}

// ============================================================
// SUPABASE HELPERS - per-user "last studied" timestamp per set
// (used to sort the Study Sets list, most recently studied first)
// ============================================================
async function fetchSetLastStudied(userId) {
const { data, error } = await supabase
.from("flashcard_set_last_studied")
.select("set_id, last_studied_at")
.eq("user_id", userId);
if (error) { console.error("Error fetching set-last-studied:", error); return {}; }
const map = {};
for (const row of data || []) map[row.set_id] = row.last_studied_at;
return map;
}

async function touchSetLastStudied(userId, setId) {
const { error } = await supabase.from("flashcard_set_last_studied").upsert(
{ user_id: userId, set_id: setId, last_studied_at: new Date().toISOString() },
{ onConflict: "user_id,set_id" }
);
if (error) console.error("Error recording set study time:", error);
}

// ============================================================
// SUPABASE HELPERS - per-user progress
// ============================================================
async function fetchProgress(userId) {
const { data, error } = await supabase
.from("flashcard_progress")
.select("*")
.eq("user_id", userId);
if (error) { console.error("Error fetching progress:", error); return {}; }
const map = {};
for (const row of data) {
map[row.card_id] = {
interval: row.interval,
ease: row.ease,
reps: row.reps,
nextReview: row.next_review,
lastReview: row.last_review,
lastQuality: row.last_quality,
};
}
return map;
}

async function saveProgressRow(userId, cardId, entry) {
const { error } = await supabase.from("flashcard_progress").upsert(
{
user_id: userId,
card_id: cardId,
interval: entry.interval,
ease: entry.ease,
reps: entry.reps,
next_review: entry.nextReview,
last_review: entry.lastReview,
last_quality: entry.lastQuality,
updated_at: new Date().toISOString(),
},
{ onConflict: "user_id,card_id" }
);
if (error) console.error("Error saving progress:", error);
}

async function clearProgressRows(userId) {
const { error } = await supabase.from("flashcard_progress").delete().eq("user_id", userId);
if (error) console.error("Error clearing progress:", error);
}

// ============================================================
// LOCAL STORAGE HELPERS (guest progress only -- signed-in users use Supabase)
// ============================================================
const STORAGE_KEYS = {
PROGRESS: "fc_progress_v1",
};

function loadFromStorage(key, fallback) {
try {
const data = localStorage.getItem(key);
return data ? JSON.parse(data) : fallback;
} catch { return fallback; }
}

function saveToStorage(key, value) {
try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
}

// ============================================================
// SPACED REPETITION (SM-2 simplified)
// ============================================================
function getNextReview(card, quality) {
const now = Date.now();
const prev = card || { interval: 0, ease: 2.5, reps: 0, nextReview: now };
let { interval, ease, reps } = prev;

if (quality < 2) {
reps = 0;
interval = 1;
} else {
if (reps === 0) interval = 1;
else if (reps === 1) interval = 6;
else interval = Math.round(interval * ease);
reps++;
}

ease = Math.max(1.3, ease + (0.1 - (3 - quality) * (0.08 + (3 - quality) * 0.02)));

if (quality === 3) interval = Math.round(interval * 1.3);
if (quality === 1) interval = Math.max(1, Math.round(interval * 0.6));

const nextReview = now + interval * 60 * 1000;
return { interval, ease, reps, nextReview, lastReview: now, lastQuality: quality };
}

// ============================================================
// GRADE FEEDBACK -- fun random animation + sound when you get a card right
// ============================================================
// How long the popup stays on screen, start to finish (matches the
// `gradePop` CSS animation duration). Deliberately much longer than the
// card's own slide-out/slide-in timing, so it's still lingering over the
// next card for a while after the deck has already moved on.
const FEEDBACK_DURATION_MS = 1600;

const CORRECT_FEEDBACK = [
{ icon: '✅', message: 'Nice!' },
{ icon: '🎉', message: 'Great job!' },
{ icon: '🔥', message: "You're on fire!" },
{ icon: '⭐', message: 'Correct!' },
{ icon: '💪', message: 'Nailed it!' },
{ icon: '😄', message: 'Awesome!' },
{ icon: '🙌', message: 'Boom!' },
];

function pickCorrectFeedback() {
return CORRECT_FEEDBACK[Math.floor(Math.random() * CORRECT_FEEDBACK.length)];
}

// Synthesizes a short, randomized "success" chime with the Web Audio API --
// no audio file to ship, and it only ever runs from a click handler so
// browser autoplay restrictions don't block it.
function playCorrectSound() {
try {
const AudioCtx = window.AudioContext || window.webkitAudioContext;
if (!AudioCtx) return;
const ctx = new AudioCtx();
const now = ctx.currentTime;
const chimes = [
[523.25, 659.25, 783.99], // C5 E5 G5
[587.33, 739.99, 880.00], // D5 F#5 A5
[659.25, 830.61, 987.77], // E5 G#5 B5
[698.46, 880.00, 1046.50], // F5 A5 C6
];
const notes = chimes[Math.floor(Math.random() * chimes.length)];
notes.forEach((freq, i) => {
const osc = ctx.createOscillator();
const gain = ctx.createGain();
osc.type = 'sine';
osc.frequency.value = freq;
const start = now + i * 0.09;
gain.gain.setValueAtTime(0, start);
gain.gain.linearRampToValueAtTime(0.16, start + 0.02);
gain.gain.exponentialRampToValueAtTime(0.001, start + 0.3);
osc.connect(gain);
gain.connect(ctx.destination);
osc.start(start);
osc.stop(start + 0.32);
});
setTimeout(() => ctx.close(), 600);
} catch (e) { /* audio is a nice-to-have -- never block grading on it */ }
}

// ============================================================
// COMPONENTS
// ============================================================

// --- Image attachment popup (a card's reference image/document) ---
function ImageLightbox({ url, onClose }) {
return (
<div className="modal-overlay" onClick={onClose} style={{zIndex:200}}>
<div onClick={e => e.stopPropagation()} style={{maxWidth:'92vw', maxHeight:'88vh', display:'flex', flexDirection:'column', alignItems:'center', gap:12}}>
<img src={url} alt="Attached document" style={{maxWidth:'92vw', maxHeight:'76vh', borderRadius:12, boxShadow:'0 12px 32px rgba(0,0,0,0.35)', background:'white'}} />
<button className="btn btn-outline btn-sm" onClick={onClose}>Close</button>
</div>
</div>
);
}

// A small pill button shown on a card face that has an attached image --
// stops the click from bubbling up to the card flip handler.
function AttachmentButton({ onClick, style }) {
return (
<button
type="button"
className="btn btn-sm"
onClick={e => { e.stopPropagation(); onClick(); }}
style={{position:'absolute', top:12, right:12, background:'rgba(255,255,255,0.2)', color:'white', border:'1.5px solid rgba(255,255,255,0.6)', ...style}}
title="View attached image"
>
📎 View Image
</button>
);
}

// Pops a random checkmark/emoji + message over the card for a moment when
// you grade a card correct. Purely decorative -- pointer-events:none so it
// never blocks a click, and a fresh `key` each time so the CSS animation
// restarts even if the same icon gets picked twice in a row.
function GradeFeedback({ feedback }) {
if (!feedback) return null;
return (
<div key={feedback.key} className="grade-feedback">
<div className="grade-feedback-icon">{feedback.icon}</div>
<div className="grade-feedback-text">{feedback.message}</div>
</div>
);
}

// --- Flashcard ---
function Flashcard({ card, index, total, flipped, onFlip }) {
const [showImage, setShowImage] = useState(false);
return (
<div className="card-container" onClick={onFlip}>
<div className={`card-inner ${flipped ? 'flipped' : ''}`}>
<div className="card-face card-front">
<div className="card-label">Question</div>
<div className="card-number">{index + 1} / {total}</div>
<div style={{fontSize: card.front.length > 100 ? '1rem' : '1.25rem'}}>{card.front}</div>
<div style={{position:'absolute', bottom:16, fontSize:'0.7rem', opacity:0.6}}>Tap to reveal answer</div>
{card.image_url && <AttachmentButton onClick={() => setShowImage(true)} />}
</div>
<div className="card-face card-back">
<div className="card-label">Answer</div>
<div className="card-number">{index + 1} / {total}</div>
<div style={{fontSize: card.back.length > 100 ? '1rem' : '1.25rem'}}>{card.back}</div>
{card.image_url && <AttachmentButton onClick={() => setShowImage(true)} />}
</div>
</div>
{card.image_url && showImage && <ImageLightbox url={card.image_url} onClose={() => setShowImage(false)} />}
</div>
);
}

// --- Auth: sign in / sign up modal ---
function AuthModal({ onClose }) {
const [mode, setMode] = useState('sign_in');
const [email, setEmail] = useState('');
const [password, setPassword] = useState('');
const [error, setError] = useState('');
const [notice, setNotice] = useState('');
const [submitting, setSubmitting] = useState(false);

async function handleSubmit(e) {
e.preventDefault();
setError('');
setNotice('');
setSubmitting(true);

if (mode === 'sign_in') {
const { error } = await supabase.auth.signInWithPassword({ email, password });
setSubmitting(false);
if (error) { setError(error.message); return; }
onClose();
} else {
const { data, error } = await supabase.auth.signUp({ email, password });
setSubmitting(false);
if (error) { setError(error.message); return; }
if (!data.session) {

// --- Study Screen ---
function StudyScreen({ cards, progress, setProgress, onBack, onStartSubset, title }) {
const [index, setIndex] = useState(0);
const [flipped, setFlipped] = useState(false);
// Once you've flipped a card at least once, the Correct/Incorrect buttons
// stay put even if you flip back to re-read the question -- only actually
// grading the card (or moving to the next one) clears this.
const [revealed, setRevealed] = useState(false);
const [graded, setGraded] = useState(false);
const [sessionStats, setSessionStats] = useState({ correct: 0, incorrect: 0, total: cards.length });
const [missedCards, setMissedCards] = useState([]);
const [done, setDone] = useState(false);
const [showMissedList, setShowMissedList] = useState(false);
// Card-to-card transition: the whole card slides out to the left, the next
// one slides in from the right. `transitioning` blocks flipping/grading
// mid-animation so a fast second click can't land on the wrong card.
const [transitioning, setTransitioning] = useState(false);
const [slideClass, setSlideClass] = useState('');
// A random checkmark/emoji + message that pops over the card for a few
// seconds when you get one right (see GradeFeedback / playCorrectSound
// above). Its own timer (feedbackTimer) is independent of the card
// slide-out/slide-in timers below, so it keeps lingering even after the
// deck has already moved on to the next card.
const [feedback, setFeedback] = useState(null);
const feedbackTimer = useRef(null);

useEffect(() => {
return () => { if (feedbackTimer.current) clearTimeout(feedbackTimer.current); };
}, []);

const card = cards[index];

function toggleFlip() {
if (graded || transitioning) return;
setFlipped(f => !f);
setRevealed(true);
}

function grade(isCorrect) {
if (transitioning) return;
const quality = isCorrect ? 2 : 0;
const updated = getNextReview(progress[card.id], quality);
const newProgress = { ...progress, [card.id]: updated };
setProgress(newProgress, card.id, updated);
setGraded(true);
setTransitioning(true);

if (isCorrect) {
setSessionStats(s => ({ ...s, correct: s.correct + 1 }));
// Independent lifecycle from the card transition below -- clear any
// popup still lingering from a fast previous answer, show the new one,
// and let it fade on its own clock even after the card has moved on.
if (feedbackTimer.current) clearTimeout(feedbackTimer.current);
setFeedback({ ...pickCorrectFeedback(), key: Date.now() });
feedbackTimer.current = setTimeout(() => setFeedback(null), FEEDBACK_DURATION_MS);
playCorrectSound();
} else {
setSessionStats(s => ({ ...s, incorrect: s.incorrect + 1 }));
setMissedCards(prev => [...prev, card]);
}

// Just enough of a beat to register the click before the card moves on
// -- the fun feedback above no longer waits on this, it has its own
// much longer timer now.
const holdMs = isCorrect ? 350 : 150;
const slideOutMs = 320;

setTimeout(() => {
setSlideClass('card-exit');
}, holdMs);

setTimeout(() => {
if (index < cards.length - 1) {
setIndex(index + 1);
setRevealed(false);
setGraded(false);
setFlipped(false);
// Jump the new card off-screen to the right with no transition, then
// let it animate into place on the next paint -- so the incoming
// answer is never visible mid-swap, and the motion actually reads as
// "next card sliding in" rather than a flip.
setSlideClass('card-enter-start');
requestAnimationFrame(() => {
requestAnimationFrame(() => {
setSlideClass('');
setTransitioning(false);
});
});
} else {
setDone(true);
setTransitioning(false);
}
}, holdMs + slideOutMs);
}

if (done) {
const pct = cards.length > 0 ? Math.round((sessionStats.correct / cards.length) * 100) : 0;
return (
<div className="animate-in" style={{padding:24, maxWidth:540, margin:'0 auto', textAlign:'center'}}>
<div style={{fontSize:'3rem', marginBottom:16}}>{pct >= 80 ? '🎉' : pct >= 50 ? '👍' : '💪'}</div>
<h2 style={{marginBottom:8}}>Session Complete!</h2>
<p style={{color:'var(--text2)', marginBottom:24}}>{title}</p>
<div style={{display:'flex', justifyContent:'center', gap:24, marginBottom:28}}>
<div><div style={{fontSize:'1.8rem', fontWeight:700, color:'var(--green)'}}>{sessionStats.correct}</div><div style={{fontSize:'0.75rem', color:'var(--text2)'}}>Correct</div></div>
<div><div style={{fontSize:'1.8rem', fontWeight:700, color:'var(--red)'}}>{sessionStats.incorrect}</div><div style={{fontSize:'0.75rem', color:'var(--text2)'}}>Missed</div></div>
<div><div style={{fontSize:'1.8rem', fontWeight:700, color:'var(--accent)'}}>{pct}%</div><div style={{fontSize:'0.75rem', color:'var(--text2)'}}>Score</div></div>
</div>

{missedCards.length > 0 && (
<div style={{marginBottom:20}}>
<button
className="btn btn-lg"
style={{width:'100%', justifyContent:'center', background:'var(--red)', color:'white', marginBottom:10}}
onClick={() => onStartSubset(missedCards, 'Reviewing Missed Cards')}
>
Study Missed Cards ({missedCards.length})
</button>
<button
className="btn btn-outline btn-sm"
onClick={() => setShowMissedList(!showMissedList)}
>
{showMissedList ? 'Hide' : 'View'} Missed Cards
</button>

{showMissedList && (
<div style={{marginTop:14, textAlign:'left'}}>
{missedCards.map((mc, i) => (
<div key={mc.id} style={{background:'var(--surface)', border:'1px solid var(--surface2)', borderRadius:10, padding:'12px 16px', marginBottom:8}}>
<div style={{fontSize:'0.8rem', color:'var(--red)', marginBottom:4}}>Missed #{i + 1}</div>
<div style={{fontSize:'0.9rem', fontWeight:600, marginBottom:4}}>{mc.front}</div>
<div style={{fontSize:'0.85rem', color:'var(--text2)'}}>{mc.back}</div>
</div>
))}
</div>
)}
</div>
)}

<button className="btn btn-accent btn-lg" onClick={onBack}>Back to Home</button>
</div>
);
}

if (!card) return <div style={{padding:24, textAlign:'center'}}>No cards to study.<br/><button className="btn btn-accent" style={{marginTop:16}} onClick={onBack}>Back</button></div>;

const progressPct = ((index) / cards.length) * 100;

return (

<div style={{display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:16}}>

</div>

{/* GradeFeedback lives outside .card-slide-wrap (a stable, non-sliding
    parent) so it stays centered in place -- unaffected by, and outlasting,
    the card underneath sliding out and the next one sliding in. */}
<div style={{position:'relative'}}>
<div className={`card-slide-wrap ${slideClass}`}>
{/* key={card.id} forces a fresh card-inner per card, instead of
    reusing the same DOM node -- otherwise resetting `flipped` on the
    incoming card would animate it (via .card-inner's own transition)
    rotating back from the answer side, which reads as the new card
    "flipping in" instead of just sliding in already question-side-up. */}

</div>
<GradeFeedback feedback={feedback} />
</div>

{revealed && !graded && (

<button className="btn btn-red btn-lg" style={{minWidth:130, justifyContent:'center'}} onClick={() => grade(false)}>Incorrect</button>
<button className="btn btn-green btn-lg" style={{minWidth:130, justifyContent:'center'}} onClick={() => grade(true)}>Correct</button>
</div>
)}

{!revealed && (
<div style={{textAlign:'center', marginTop:20}}>
<button className="btn btn-accent btn-lg" onClick={toggleFlip}>Flip</button>
</div>
)}
</div>
);
}

// --- Quiz Mode ---
// setId + user are optional: when both are present (a set-scoped test, taken
// while signed in) the finished score is saved as a new row in
// flashcard_test_attempts. "Resetting" a test is just retaking it -- past
// attempts are never overwritten or deleted, so the history keeps growing.
function QuizScreen({ cards, progress, setProgress, onBack, setId, user, label }) {
const [index, setIndex] = useState(0);
const [selected, setSelected] = useState(null);
const [sessionStats, setSessionStats] = useState({ correct: 0, incorrect: 0 });
const [done, setDone] = useState(false);
const [options, setOptions] = useState([]);
const [saved, setSaved] = useState(false);
const [showImage, setShowImage] = useState(false);

const card = cards[index];

useEffect(() => {
if (done && setId && user && !saved) {
setSaved(true);
insertTestAttempt(user.id, setId, sessionStats.correct, cards.length);
}
}, [done]);

useEffect(() => {
if (card && cards.length >= 2) {
const wrongCards = cards.filter(c => c.id !== card.id);
const shuffledWrong = wrongCards.sort(() => Math.random() - 0.5).slice(0, 3);
const allOptions = [{ text: card.back, correct: true }, ...shuffledWrong.map(c => ({ text: c.back, correct: false }))];
setOptions(allOptions.sort(() => Math.random() - 0.5));
}
setShowImage(false);
}, [index, card]);

function handleSelect(opt, idx) {
if (selected !== null) return;
setSelected(idx);

const quality = opt.correct ? 2 : 0;
const updated = getNextReview(progress[card.id], quality);
setProgress(prev => ({ ...prev, [card.id]: updated }), card.id, updated);

if (opt.correct) {
setSessionStats(s => ({ ...s, correct: s.correct + 1 }));
} else {
setSessionStats(s => ({ ...s, incorrect: s.incorrect + 1 }));
}

setTimeout(() => {
if (index < cards.length - 1) {
setIndex(index + 1);
setSelected(null);
} else {
setDone(true);
}
}, 1200);
}

if (done) {
const pct = cards.length > 0 ? Math.round((sessionStats.correct / cards.length) * 100) : 0;
return (
<div className="animate-in" style={{padding:24, maxWidth:500, margin:'0 auto', textAlign:'center'}}>

<div><div style={{fontSize:'1.8rem', fontWeight:700, color:'var(--red)'}}>{sessionStats.incorrect}</div><div style={{fontSize:'0.75rem', color:'var(--text2)'}}>Wrong</div></div>
<div><div style={{fontSize:'1.8rem', fontWeight:700, color:'var(--accent)'}}>{pct}%</div><div style={{fontSize:'0.75rem', color:'var(--text2)'}}>Score</div></div>
</div>
{setId && (
<p style={{fontSize:'0.8rem', color:'var(--text2)', marginBottom:20}}>
{user ? 'Saved to this set\'s test history.' : 'Sign in to save scores to this set\'s test history.'}
</p>
)}
<button className="btn btn-accent btn-lg" onClick={onBack}>{setId ? 'Back to Set' : 'Back to Home'}</button>
</div>
);
}

if (!card || cards.length < 2) {
return (
<div style={{padding:24, textAlign:'center'}}>

<button className="btn btn-accent" style={{marginTop:16}} onClick={onBack}>Back</button>

return (
<div className="animate-in" style={{padding:24, maxWidth:560, margin:'0 auto'}}>

<button className="btn btn-outline btn-sm" onClick={onBack}>← Back</button>

<div className="progress-fill" style={{width: ((index) / cards.length) * 100 + '%', background:'var(--accent)'}} />
</div>

<div style={{position:'relative', background:'var(--surface)', borderRadius:16, padding:'28px 24px', border:'1px solid var(--surface2)', marginBottom:20, textAlign:'center'}}>
<div style={{fontSize:'0.7rem', color:'var(--text2)', textTransform:'uppercase', letterSpacing:2, marginBottom:12}}>Question {index + 1} of {cards.length}</div>
<div style={{fontSize:'1.15rem', lineHeight:1.6}}>{card.front}</div>
{card.image_url && (
<button
type="button"
className="btn btn-outline btn-sm"
onClick={() => setShowImage(true)}

📎 View Image

<div style={{display:'flex', flexDirection:'column', gap:10}}>
{options.map((opt, i) => (
<button
key={i}

{opt.text}

</div>

{selected !== null && (

// --- Sets list ---
function formatLastStudied(iso) {
const diffMs = Date.now() - new Date(iso).getTime();
const mins = Math.round(diffMs / 60000);
if (mins < 1) return 'Studied just now';
if (mins < 60) return `Studied ${mins}m ago`;
const hours = Math.round(mins / 60);
if (hours < 24) return `Studied ${hours}h ago`;
const days = Math.round(hours / 24);
if (days < 30) return `Studied ${days}d ago`;
return `Studied on ${new Date(iso).toLocaleDateString()}`;
}

// lastStudied is a per-user map of { [setId]: isoTimestamp }, populated by
// touchSetStudied() whenever the signed-in user starts studying or testing
// a set. Sets with a timestamp sort to the top, most recent first; sets
// never studied keep their original order after those.
function SetsScreen({ sets, cards, lastStudied, onBack, onOpenSet, loading }) {
const sortedSets = [...sets].sort((a, b) => {
const ta = lastStudied?.[a.id];
const tb = lastStudied?.[b.id];
if (ta && tb) return new Date(tb) - new Date(ta);
if (ta) return -1;
if (tb) return 1;
return 0;
});

return (
<div className="animate-in" style={{padding:24, maxWidth:600, margin:'0 auto'}}>
<div style={{display:'flex', alignItems:'center', gap:12, marginBottom:20}}>
<button className="btn btn-outline btn-sm" onClick={onBack}>← Back</button>
<h2 style={{fontSize:'1.2rem'}}>Study Sets</h2>
</div>

{loading ? (
<div style={{textAlign:'center', padding:40, color:'var(--text2)'}}>
<div className="spinner" style={{marginBottom:12}} />
<p>Loading sets...</p>
</div>
) : sets.length === 0 ? (
<div style={{textAlign:'center', padding:40, color:'var(--text2)'}}>
<p style={{marginBottom:12}}>No sets yet.</p>
<p style={{fontSize:'0.85rem'}}>An admin can create sets from the Admin Panel to group cards for focused study and testing.</p>
</div>
) : (
<div style={{display:'flex', flexDirection:'column', gap:10}}>
{sortedSets.map(s => {
const count = cards.filter(c => c.set_id === s.id).length;
const studiedAt = lastStudied?.[s.id];
return (
<button
key={s.id}
onClick={() => onOpenSet(s)}
className="btn btn-surface"
style={{width:'100%', justifyContent:'space-between', textAlign:'left', padding:'16px 18px', height:'auto'}}
>
<span>
<span style={{display:'block', fontWeight:600, fontSize:'0.95rem'}}>{s.name}</span>
{s.description && <span style={{display:'block', fontSize:'0.8rem', color:'var(--text2)', fontWeight:400, marginTop:2}}>{s.description}</span>}
{studiedAt && <span style={{display:'block', fontSize:'0.75rem', color:'var(--accent)', fontWeight:400, marginTop:2}}>{formatLastStudied(studiedAt)}</span>}
</span>
<span style={{fontSize:'0.8rem', color:'var(--text2)', whiteSpace:'nowrap', marginLeft:12}}>{count} card{count === 1 ? '' : 's'}</span>
</button>
);
})}
</div>
)}
</div>
);
}

// --- One set: study it, test it, and see past test scores ---
function SetDetailScreen({ set, cards, progress, user, onBack, onStudy, onTest }) {
const [attempts, setAttempts] = useState([]);
const [loadingAttempts, setLoadingAttempts] = useState(!!user);

useEffect(() => {
let cancelled = false;
if (user) {
setLoadingAttempts(true);
fetchTestAttempts(user.id, set.id).then(rows => {
if (!cancelled) { setAttempts(rows); setLoadingAttempts(false); }
});
} else {
setAttempts([]);
setLoadingAttempts(false);
}
return () => { cancelled = true; };
}, [user, set.id]);

const setCards = cards.filter(c => c.set_id === set.id);
const known = setCards.filter(c => progress[c.id]?.lastQuality >= 2).length;

return (
<div className="animate-in" style={{padding:24, maxWidth:600, margin:'0 auto'}}>
<div style={{display:'flex', alignItems:'center', gap:12, marginBottom:20}}>
<button className="btn btn-outline btn-sm" onClick={onBack}>← Back</button>
<h2 style={{fontSize:'1.2rem'}}>{set.name}</h2>
</div>

{set.description && <p style={{color:'var(--text2)', fontSize:'0.9rem', marginBottom:20}}>{set.description}</p>}

<div style={{display:'grid', gridTemplateColumns:'repeat(2, 1fr)', gap:12, marginBottom:24}}>
<div style={{background:'var(--surface)', borderRadius:12, padding:'16px 18px', border:'1px solid var(--surface2)'}}>
<div style={{fontSize:'1.4rem', fontWeight:700, color:'var(--accent)'}}>{setCards.length}</div>
<div style={{fontSize:'0.75rem', color:'var(--text2)', marginTop:2}}>Cards in Set</div>
</div>
<div style={{background:'var(--surface)', borderRadius:12, padding:'16px 18px', border:'1px solid var(--surface2)'}}>
<div style={{fontSize:'1.4rem', fontWeight:700, color:'var(--green)'}}>{known}</div>
<div style={{fontSize:'0.75rem', color:'var(--text2)', marginTop:2}}>Known</div>
</div>
</div>

{setCards.length === 0 ? (
<p style={{textAlign:'center', color:'var(--text2)', padding:24}}>No cards in this set yet.</p>
) : (
<div style={{display:'flex', flexDirection:'column', gap:10, marginBottom:32}}>
<button className="btn btn-accent btn-lg" style={{width:'100%', justifyContent:'center'}} onClick={() => onStudy(setCards)}>
Study This Set ({setCards.length})
</button>
<button className="btn btn-outline btn-lg" style={{width:'100%', justifyContent:'center'}} onClick={() => onStudy([...setCards].sort(() => Math.random() - 0.5))}>
Shuffle & Study
</button>
<button className="btn btn-outline btn-lg" style={{width:'100%', justifyContent:'center'}} onClick={() => onTest(setCards)} disabled={setCards.length < 2}>
Test This Set{setCards.length < 2 ? ' (needs 2+ cards)' : ''}
</button>
</div>
)}

<div>
<h3 style={{fontSize:'0.95rem', marginBottom:10}}>Test History</h3>
{!user ? (
<p style={{fontSize:'0.85rem', color:'var(--text2)'}}>Sign in to keep a history of your test scores for this set. Retaking a test never erases past scores -- every attempt is kept.</p>
) : loadingAttempts ? (
<p style={{fontSize:'0.85rem', color:'var(--text2)'}}>Loading...</p>
) : attempts.length === 0 ? (
<p style={{fontSize:'0.85rem', color:'var(--text2)'}}>No test attempts yet. Take the test above to start your history.</p>
) : (
<div style={{display:'flex', flexDirection:'column', gap:6}}>
{attempts.map(a => {
const pct = a.total > 0 ? Math.round((a.score / a.total) * 100) : 0;
const date = new Date(a.taken_at);
return (
<div key={a.id} style={{display:'flex', justifyContent:'space-between', alignItems:'center', background:'var(--surface)', border:'1px solid var(--surface2)', borderRadius:10, padding:'10px 14px', fontSize:'0.85rem'}}>
<span style={{color:'var(--text2)'}}>{date.toLocaleDateString()} {date.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span>
<span>
<span style={{fontWeight:600}}>{a.score}/{a.total}</span>
<span style={{color: pct >= 80 ? 'var(--green)' : pct >= 50 ? 'var(--yellow)' : 'var(--red)', marginLeft:8}}>{pct}%</span>
</span>
</div>
);
})}
</div>
)}
</div>
</div>
);
}

// --- Admin Panel ---
function AdminPanel({ cards, setCards, sets, setSets, refreshSets, onBack, refreshCards, isAdmin }) {
const [editingCard, setEditingCard] = useState(null);
const [showAdd, setShowAdd] = useState(false);
const [newFront, setNewFront] = useState('');
const [newBack, setNewBack] = useState('');
const [newSetId, setNewSetId] = useState('');
const [newImageFile, setNewImageFile] = useState(null);
const [newImagePreview, setNewImagePreview] = useState('');
const [editImageFile, setEditImageFile] = useState(null);
const [editImagePreview, setEditImagePreview] = useState('');
const [uploadingImage, setUploadingImage] = useState(false);
const [importText, setImportText] = useState('');
const [showImport, setShowImport] = useState(false);
const [showExport, setShowExport] = useState(false);
const [saving, setSaving] = useState(false);
const [error, setError] = useState('');
const [confirmDeleteCard, setConfirmDeleteCard] = useState(null);
const [filterSetId, setFilterSetId] = useState('all');
const [tab, setTab] = useState('cards'); // 'cards' | 'sets'

function pickImage(file, setFile, setPreview) {
if (!file) return;
if (!file.type.startsWith('image/')) {
setError('Please choose an image file.');
setTimeout(() => setError(''), 3000);
return;
}
setFile(file);
const reader = new FileReader();
reader.onload = e => setPreview(e.target.result);
reader.readAsDataURL(file);
}

// Belt-and-suspenders: the "Admin Panel" button is hidden from non-admins,
// but Row Level Security in Supabase is what actually enforces this --
// even if someone lands here directly they can't write anything.
if (!isAdmin) {
return (
<div style={{padding:24, maxWidth:420, margin:'60px auto', textAlign:'center'}}>
<p style={{color:'var(--text2)', marginBottom:16}}>You need admin access to view this page.</p>
<button className="btn btn-accent" onClick={onBack}>Back</button>
</div>
);
}

async function addCard() {
if (!newFront.trim() || !newBack.trim()) return;
setSaving(true);
let imageUrl = null;
if (newImageFile) {
setUploadingImage(true);
imageUrl = await uploadCardImage(newImageFile);
setUploadingImage(false);
if (!imageUrl) {
setError('Card was not saved -- the image failed to upload.');
setTimeout(() => setError(''), 3000);
setSaving(false);
return;
}
}
const newCard = await insertCard(newFront.trim(), newBack.trim(), [], imageUrl);
if (newCard) {
if (newSetId) {
await updateCardSet(newCard.id, Number(newSetId));
newCard.set_id = Number(newSetId);
}
setCards(prev => [...prev, newCard]);
setNewFront('');
setNewBack('');
setNewSetId('');
setNewImageFile(null);
setNewImagePreview('');
setShowAdd(false);
} else {
setError('Failed to add card. Check your Supabase connection.');
setTimeout(() => setError(''), 3000);
}
setSaving(false);
}

// Deletes now go through a confirmation dialog -- a single stray click
// (or the next card sliding under your cursor as the list re-renders
// after a delete) can no longer wipe out cards you didn't mean to touch.
async function handleDelete(id) {
setSaving(true);
const ok = await deleteCardFromDB(id);
if (ok) {
setCards(prev => prev.filter(c => c.id !== id));
setConfirmDeleteCard(null);
} else {
setError('Failed to delete card.');
setTimeout(() => setError(''), 3000);
}
setSaving(false);
}

async function saveEdit() {
if (!editingCard) return;
setSaving(true);
let imageUrl = editingCard.image_url || null;
if (editImageFile) {
setUploadingImage(true);
const uploaded = await uploadCardImage(editImageFile);
setUploadingImage(false);
if (!uploaded) {
setError('Changes were not saved -- the image failed to upload.');
setTimeout(() => setError(''), 3000);
setSaving(false);
return;
}
imageUrl = uploaded;
}
const ok = await updateCard(editingCard.id, editingCard.front, editingCard.back);
if (ok) {
await updateCardSet(editingCard.id, editingCard.set_id || null);
await updateCardImage(editingCard.id, imageUrl);
const finalCard = { ...editingCard, image_url: imageUrl };
setCards(prev => prev.map(c => c.id === editingCard.id ? finalCard : c));
setEditingCard(null);
setEditImageFile(null);
setEditImagePreview('');
} else {
setError('Failed to save changes.');
setTimeout(() => setError(''), 3000);
}
setSaving(false);
}

async function handleMoveCard(cardId, rawSetId) {
const setId = rawSetId ? Number(rawSetId) : null;
const ok = await updateCardSet(cardId, setId);
if (ok) {
setCards(prev => prev.map(c => c.id === cardId ? { ...c, set_id: setId } : c));
} else {
setError('Failed to move card.');
setTimeout(() => setError(''), 3000);
}
}

async function handleImport() {
try {
const data = JSON.parse(importText);
if (Array.isArray(data) && data.length > 0) {
setSaving(true);
const toImport = data.map(c => ({
front: c.front || c.question || '',
back: c.back || c.answer || '',
tags: c.tags || [],
}));
const imported = await importCardsToDB(toImport);
if (imported.length > 0) {
setCards(prev => [...prev, ...imported]);
setImportText('');
setShowImport(false);
} else {
setError('Failed to import cards.');
setTimeout(() => setError(''), 3000);
}
setSaving(false);
}
} catch { setError('Invalid JSON format'); setTimeout(() => setError(''), 3000); }
}

const visibleCards = filterSetId === 'all' ? cards : cards.filter(c => (filterSetId === 'none' ? !c.set_id : c.set_id === Number(filterSetId)));

return (
<div className="animate-in" style={{padding:24, maxWidth:700, margin:'0 auto'}}>
<div style={{display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:20}}>
<div style={{display:'flex', alignItems:'center', gap:12}}>
<button className="btn btn-outline btn-sm" onClick={onBack}>← Back</button>
<h2 style={{fontSize:'1.2rem'}}>Admin Panel</h2>
</div>
<div style={{display:'flex', gap:8}}>
<button className="btn btn-outline btn-sm" onClick={refreshCards} title="Refresh from database">↻ Refresh</button>
</div>
</div>

{/* Tabs */}
<div style={{display:'flex', overflow:'hidden', borderRadius:10, border:'1px solid var(--border)', width:'fit-content', marginBottom:20}}>
<button
className="btn btn-sm"
style={{borderRadius:0, background: tab === 'cards' ? 'var(--accent)' : 'transparent', color: tab === 'cards' ? 'white' : 'var(--text2)'}}
onClick={() => setTab('cards')}
>
Cards
</button>
<button
className="btn btn-sm"
style={{borderRadius:0, background: tab === 'sets' ? 'var(--accent)' : 'transparent', color: tab === 'sets' ? 'white' : 'var(--text2)'}}
onClick={() => setTab('sets')}
>
Sets
</button>
</div>

{error && <div style={{color:'var(--red)', fontSize:'0.85rem', marginBottom:10}}>{error}</div>}
{saving && <div style={{display:'flex', alignItems:'center', gap:8, marginBottom:10, fontSize:'0.85rem', color:'var(--text2)'}}><div className="spinner" /> Saving...</div>}

{tab === 'sets' && (
<SetsManager sets={sets} setSets={setSets} refreshSets={refreshSets} cards={cards} />
)}

{tab === 'cards' && (
<>
{/* Action bar */}
<div className="action-bar" style={{display:'flex', gap:8, marginBottom:16, flexWrap:'wrap', alignItems:'center'}}>
<button className="btn btn-accent btn-sm" onClick={() => setShowAdd(true)}>+ Add Card</button>
<button className="btn btn-surface btn-sm" onClick={() => setShowImport(true)}>Import JSON</button>
<button className="btn btn-surface btn-sm" onClick={() => setShowExport(true)}>Export JSON</button>
<select className="input" style={{width:'auto', marginLeft:'auto'}} value={filterSetId} onChange={e => setFilterSetId(e.target.value)}>
<option value="all">All cards ({cards.length})</option>
<option value="none">No set ({cards.filter(c => !c.set_id).length})</option>
{sets.map(s => (
<option key={s.id} value={s.id}>{s.name} ({cards.filter(c => c.set_id === s.id).length})</option>
))}
</select>
</div>

{/* Add Card Modal */}
{showAdd && (
<div className="modal-overlay" onClick={e => e.target === e.currentTarget && setShowAdd(false)}>
<div className="modal">
<h3 style={{marginBottom:16}}>Add New Card</h3>
<label style={{fontSize:'0.8rem', color:'var(--text2)', display:'block', marginBottom:4}}>Front (Question)</label>
<textarea className="input textarea" value={newFront} onChange={e => setNewFront(e.target.value)} placeholder="Enter the question..." style={{marginBottom:12}} />
<label style={{fontSize:'0.8rem', color:'var(--text2)', display:'block', marginBottom:4}}>Back (Answer)</label>
<textarea className="input textarea" value={newBack} onChange={e => setNewBack(e.target.value)} placeholder="Enter the answer..." style={{marginBottom:12}} />
<label style={{fontSize:'0.8rem', color:'var(--text2)', display:'block', marginBottom:4}}>Set (optional)</label>
<select className="input" value={newSetId} onChange={e => setNewSetId(e.target.value)} style={{marginBottom:16}}>
<option value="">No set</option>
{sets.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
</select>
<label style={{fontSize:'0.8rem', color:'var(--text2)', display:'block', marginBottom:4}}>Attach an image (optional)</label>
<input type="file" accept="image/*" className="input" style={{marginBottom:8}} onChange={e => pickImage(e.target.files[0], setNewImageFile, setNewImagePreview)} />
{newImagePreview && (
<div style={{marginBottom:16, position:'relative', display:'inline-block'}}>
<img src={newImagePreview} alt="Preview" style={{maxWidth:'100%', maxHeight:140, borderRadius:8, display:'block'}} />
<button type="button" className="btn btn-sm" style={{marginTop:6, background:'transparent', color:'var(--red)', border:'1.5px solid var(--red)'}} onClick={() => { setNewImageFile(null); setNewImagePreview(''); }}>Remove</button>
</div>
)}
<div style={{display:'flex', gap:8, justifyContent:'flex-end'}}>
<button className="btn btn-outline btn-sm" onClick={() => { setShowAdd(false); setNewImageFile(null); setNewImagePreview(''); }}>Cancel</button>
<button className="btn btn-accent btn-sm" onClick={addCard} disabled={saving || uploadingImage}>{uploadingImage ? 'Uploading image...' : saving ? 'Saving...' : 'Add Card'}</button>
</div>
</div>
</div>
)}

{/* Import Modal */}
{showImport && (
<div className="modal-overlay" onClick={e => e.target === e.currentTarget && setShowImport(false)}>
<div className="modal">
<h3 style={{marginBottom:8}}>Import Cards</h3>
<p style={{fontSize:'0.8rem', color:'var(--text2)', marginBottom:12}}>Paste a JSON array of objects with "front" and "back" fields.</p>
<textarea className="input textarea" style={{minHeight:120, marginBottom:12}} value={importText} onChange={e => setImportText(e.target.value)} placeholder='[{"front":"Q1","back":"A1"}]' />
<div style={{display:'flex', gap:8, justifyContent:'flex-end'}}>
<button className="btn btn-outline btn-sm" onClick={() => setShowImport(false)}>Cancel</button>
<button className="btn btn-accent btn-sm" onClick={handleImport} disabled={saving}>{saving ? 'Importing...' : 'Import'}</button>
</div>
</div>
</div>
)}

{/* Export Modal */}
{showExport && (
<div className="modal-overlay" onClick={e => e.target === e.currentTarget && setShowExport(false)}>
<div className="modal">
<h3 style={{marginBottom:12}}>Export Cards</h3>
<textarea className="input textarea" style={{minHeight:150, fontFamily:'monospace', fontSize:'0.8rem'}} readOnly value={JSON.stringify(cards.map(c => ({front: c.front, back: c.back})), null, 2)} />
<div style={{display:'flex', gap:8, justifyContent:'flex-end', marginTop:12}}>
<button className="btn btn-outline btn-sm" onClick={() => setShowExport(false)}>Close</button>
<button className="btn btn-accent btn-sm" onClick={() => { navigator.clipboard.writeText(JSON.stringify(cards.map(c => ({front: c.front, back: c.back})), null, 2)); }}>Copy</button>
</div>
</div>
</div>
)}

{/* Edit Card Modal */}
{editingCard && (
<div className="modal-overlay" onClick={e => e.target === e.currentTarget && setEditingCard(null)}>
<div className="modal">
<h3 style={{marginBottom:16}}>Edit Card</h3>
<label style={{fontSize:'0.8rem', color:'var(--text2)', display:'block', marginBottom:4}}>Front (Question)</label>
<textarea className="input textarea" value={editingCard.front} onChange={e => setEditingCard({...editingCard, front: e.target.value})} style={{marginBottom:12}} />
<label style={{fontSize:'0.8rem', color:'var(--text2)', display:'block', marginBottom:4}}>Back (Answer)</label>
<textarea className="input textarea" value={editingCard.back} onChange={e => setEditingCard({...editingCard, back: e.target.value})} style={{marginBottom:12}} />
<label style={{fontSize:'0.8rem', color:'var(--text2)', display:'block', marginBottom:4}}>Set</label>
<select className="input" value={editingCard.set_id || ''} onChange={e => setEditingCard({...editingCard, set_id: e.target.value ? Number(e.target.value) : null})} style={{marginBottom:16}}>
<option value="">No set</option>
{sets.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
</select>
<label style={{fontSize:'0.8rem', color:'var(--text2)', display:'block', marginBottom:4}}>Attached image (optional)</label>
{(editImagePreview || editingCard.image_url) && (
<div style={{marginBottom:8}}>
<img src={editImagePreview || editingCard.image_url} alt="Attached" style={{maxWidth:'100%', maxHeight:140, borderRadius:8, display:'block'}} />
</div>
)}
<div style={{display:'flex', gap:8, alignItems:'center', marginBottom:16, flexWrap:'wrap'}}>
<input type="file" accept="image/*" className="input" style={{width:'auto', flex:1}} onChange={e => pickImage(e.target.files[0], setEditImageFile, setEditImagePreview)} />
{(editImagePreview || editingCard.image_url) && (
<button type="button" className="btn btn-sm" style={{background:'transparent', color:'var(--red)', border:'1.5px solid var(--red)'}} onClick={() => { setEditImageFile(null); setEditImagePreview(''); setEditingCard({...editingCard, image_url: null}); }}>Remove</button>
)}
</div>
<div style={{display:'flex', gap:8, justifyContent:'flex-end'}}>
<button className="btn btn-outline btn-sm" onClick={() => { setEditingCard(null); setEditImageFile(null); setEditImagePreview(''); }}>Cancel</button>
<button className="btn btn-accent btn-sm" onClick={saveEdit} disabled={saving || uploadingImage}>{uploadingImage ? 'Uploading image...' : saving ? 'Saving...' : 'Save'}</button>
</div>
</div>
</div>
)}

{/* Delete confirmation */}
{confirmDeleteCard && (
<ConfirmDialog
title="Delete this card?"
message={`"${confirmDeleteCard.front.slice(0, 80)}${confirmDeleteCard.front.length > 80 ? '…' : ''}" will be permanently deleted. This can't be undone.`}
busy={saving}
onCancel={() => setConfirmDeleteCard(null)}
onConfirm={() => handleDelete(confirmDeleteCard.id)}
/>
)}

{/* Card List */}
<div style={{display:'flex', flexDirection:'column', gap:8}}>
{visibleCards.length === 0 && <div style={{textAlign:'center', padding:32, color:'var(--text2)'}}>No cards here yet.</div>}
{visibleCards.map((card, i) => (
<div key={card.id} className="admin-item">
<div className="admin-item-main">
<div className="admin-item-title">{card.front}</div>
<div className="admin-item-sub">{card.back}</div>
</div>
<div className="admin-item-controls">
<select
className="input"
value={card.set_id || ''}
onChange={e => handleMoveCard(card.id, e.target.value)}
title="Move to set"
>
<option value="">No set</option>
{sets.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
</select>
<button className="btn btn-outline btn-sm" onClick={() => setEditingCard({...card})}>Edit</button>
<button className="btn btn-sm" style={{background:'transparent', color:'var(--red)', border:'1.5px solid var(--red)'}} onClick={() => setConfirmDeleteCard(card)}>Delete</button>
</div>
</div>
))}
</div>
</>
)}
</div>
);
}

// --- Admin: manage sets (create / rename / delete) ---
function SetsManager({ sets, setSets, refreshSets, cards }) {
const [name, setName] = useState('');
const [description, setDescription] = useState('');
const [showAdd, setShowAdd] = useState(false);
const [editingSet, setEditingSet] = useState(null);
const [confirmDeleteSet, setConfirmDeleteSet] = useState(null);
const [saving, setSaving] = useState(false);
const [error, setError] = useState('');

async function addSet() {
if (!name.trim()) return;
setSaving(true);
const created = await insertSet(name.trim(), description.trim());
if (created) {
setSets(prev => [...prev, created]);
setName('');
setDescription('');
setShowAdd(false);
} else {
setError('Failed to create set.');
setTimeout(() => setError(''), 3000);
}
setSaving(false);
}

async function saveEdit() {
if (!editingSet || !editingSet.name.trim()) return;
setSaving(true);
const ok = await updateSet(editingSet.id, editingSet.name.trim(), (editingSet.description || '').trim());
if (ok) {
setSets(prev => prev.map(s => s.id === editingSet.id ? editingSet : s));
setEditingSet(null);
} else {
setError('Failed to save set.');
setTimeout(() => setError(''), 3000);
}
setSaving(false);
}

async function handleDeleteSet(id) {
setSaving(true);
const ok = await deleteSetFromDB(id);
if (ok) {
setSets(prev => prev.filter(s => s.id !== id));
setConfirmDeleteSet(null);
refreshSets();
} else {
setError('Failed to delete set.');
setTimeout(() => setError(''), 3000);
}
setSaving(false);
}

return (
<div>
<div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:16}}>
<p style={{fontSize:'0.85rem', color:'var(--text2)'}}>Sets let you study and test a group of cards on its own. Deleting a set never deletes its cards -- they just become uncategorized.</p>
</div>
<button className="btn btn-accent btn-sm" onClick={() => setShowAdd(true)} style={{marginBottom:16}}>+ New Set</button>

{error && <div style={{color:'var(--red)', fontSize:'0.85rem', marginBottom:10}}>{error}</div>}

{showAdd && (
<div className="modal-overlay" onClick={e => e.target === e.currentTarget && setShowAdd(false)}>
<div className="modal">
<h3 style={{marginBottom:16}}>New Set</h3>
<label style={{fontSize:'0.8rem', color:'var(--text2)', display:'block', marginBottom:4}}>Name</label>
<input className="input" value={name} onChange={e => setName(e.target.value)} placeholder="e.g. FAR Part 15" style={{marginBottom:12}} />
<label style={{fontSize:'0.8rem', color:'var(--text2)', display:'block', marginBottom:4}}>Description (optional)</label>
<textarea className="input textarea" value={description} onChange={e => setDescription(e.target.value)} style={{marginBottom:16, minHeight:70}} />
<div style={{display:'flex', gap:8, justifyContent:'flex-end'}}>
<button className="btn btn-outline btn-sm" onClick={() => setShowAdd(false)}>Cancel</button>
<button className="btn btn-accent btn-sm" onClick={addSet} disabled={saving}>{saving ? 'Saving...' : 'Create Set'}</button>
</div>
</div>
</div>
)}

{editingSet && (
<div className="modal-overlay" onClick={e => e.target === e.currentTarget && setEditingSet(null)}>
<div className="modal">
<h3 style={{marginBottom:16}}>Edit Set</h3>
<label style={{fontSize:'0.8rem', color:'var(--text2)', display:'block', marginBottom:4}}>Name</label>
<input className="input" value={editingSet.name} onChange={e => setEditingSet({...editingSet, name: e.target.value})} style={{marginBottom:12}} />
<label style={{fontSize:'0.8rem', color:'var(--text2)', display:'block', marginBottom:4}}>Description (optional)</label>
<textarea className="input textarea" value={editingSet.description || ''} onChange={e => setEditingSet({...editingSet, description: e.target.value})} style={{marginBottom:16, minHeight:70}} />
<div style={{display:'flex', gap:8, justifyContent:'flex-end'}}>
<button className="btn btn-outline btn-sm" onClick={() => setEditingSet(null)}>Cancel</button>
<button className="btn btn-accent btn-sm" onClick={saveEdit} disabled={saving}>{saving ? 'Saving...' : 'Save'}</button>
</div>
</div>
</div>
)}

{confirmDeleteSet && (
<ConfirmDialog
title="Delete this set?"
message={`"${confirmDeleteSet.name}" will be deleted. Its ${cards.filter(c => c.set_id === confirmDeleteSet.id).length} card(s) will not be deleted -- they'll just become uncategorized. This can't be undone.`}
busy={saving}
onCancel={() => setConfirmDeleteSet(null)}
onConfirm={() => handleDeleteSet(confirmDeleteSet.id)}
/>
)}

<div style={{display:'flex', flexDirection:'column', gap:8}}>
{sets.length === 0 && <div style={{textAlign:'center', padding:32, color:'var(--text2)'}}>No sets yet. Create one to start grouping cards.</div>}
{sets.map(s => (
<div key={s.id} className="admin-item">
<div className="admin-item-main">
<div style={{fontSize:'0.9rem', fontWeight:600}}>{s.name}</div>
{s.description && <div style={{fontSize:'0.8rem', color:'var(--text2)'}}>{s.description}</div>}
<div style={{fontSize:'0.75rem', color:'var(--text2)', marginTop:2}}>{cards.filter(c => c.set_id === s.id).length} card(s)</div>
</div>
<div className="admin-item-controls">
<button className="btn btn-outline btn-sm" onClick={() => setEditingSet({...s})}>Edit</button>
<button className="btn btn-sm" style={{background:'transparent', color:'var(--red)', border:'1.5px solid var(--red)'}} onClick={() => setConfirmDeleteSet(s)}>Delete</button>
</div>
</div>
))}
</div>
</div>
);
}

// --- Generic delete/confirm dialog ---
// Used anywhere a destructive action needs a deliberate "yes" -- a card or
// set delete no longer fires straight from a single button click, so a
// rapid double-click (or the next row sliding under your cursor after the
// first delete) can't silently wipe out more than you meant to.
function ConfirmDialog({ title, message, confirmLabel = 'Delete', onConfirm, onCancel, busy }) {
return (
<div className="modal-overlay" onClick={e => e.target === e.currentTarget && !busy && onCancel()}>
<div className="modal" style={{textAlign:'center'}}>
<div style={{fontSize:'2rem', marginBottom:12}}>⚠️</div>
<h3 style={{marginBottom:8}}>{title}</h3>
<p style={{color:'var(--text2)', fontSize:'0.9rem', marginBottom:20}}>{message}</p>
<div style={{display:'flex', gap:8, justifyContent:'center'}}>
<button className="btn btn-outline" onClick={onCancel} disabled={busy}>Cancel</button>
<button className="btn btn-red" onClick={onConfirm} disabled={busy}>{busy ? 'Deleting…' : confirmLabel}</button>
</div>
</div>
</div>
);
}

// --- Reset Progress Confirmation ---
function ResetConfirm({ onConfirm, onCancel }) {
return (
<div className="modal-overlay" onClick={e => e.target === e.currentTarget && onCancel()}>
<div className="modal" style={{textAlign:'center'}}>
<div style={{fontSize:'2rem', marginBottom:12}}>⚠️</div>
<h3 style={{marginBottom:8}}>Reset Your Progress?</h3>
<p style={{color:'var(--text2)', fontSize:'0.9rem', marginBottom:20}}>This will clear all your study history and spaced repetition data. Cards will not be affected.</p>
<div style={{display:'flex', gap:8, justifyContent:'center'}}>
<button className="btn btn-outline" onClick={onCancel}>Cancel</button>
<button className="btn btn-red" onClick={onConfirm}>Reset</button>
</div>
</div>
</div>
);
}

// ============================================================
// MAIN APP
// ============================================================
function App() {
const [screen, setScreen] = useState('home');
const [cards, setCards] = useState([]);
const [loading, setLoading] = useState(true);
const [progress, setProgressState] = useState({});
const [studyCards, setStudyCards] = useState([]);
const [studyTitle, setStudyTitle] = useState('');
const [showReset, setShowReset] = useState(false);
const [studyKey, setStudyKey] = useState(0);

const [sets, setSets] = useState([]);
const [activeSet, setActiveSet] = useState(null);
const [activeSetId, setActiveSetId] = useState(null); // which set (if any) the current study/quiz session belongs to
const [setLastStudied, setSetLastStudied] = useState({}); // { [setId]: isoTimestamp }, current user only

const [user, setUser] = useState(null);
const [isAdmin, setIsAdmin] = useState(false);
const [authLoading, setAuthLoading] = useState(true);
const userRef = useRef(null);
useEffect(() => { userRef.current = user; }, [user]);

// Fetch cards from Supabase on mount
async function loadCards() {
setLoading(true);
const data = await fetchCards();
setCards(data);
setLoading(false);
}

async function loadSets() {
const data = await fetchSets();
setSets(data);
}

async function checkAdmin(currentUser) {
if (!currentUser) { setIsAdmin(false); return; }
const { data, error } = await supabase
.from('flashcard_admins')
.select('user_id')
.eq('user_id', currentUser.id)
.maybeSingle();
if (error) { console.error(error); setIsAdmin(false); return; }
setIsAdmin(!!data);
}

// One-time merge: if someone studied as a guest (localStorage) and then
// signs in for the first time, carry that progress up to Supabase instead
// of silently losing it.
async function migrateLocalProgress(currentUser) {
const local = loadFromStorage(STORAGE_KEYS.PROGRESS, {});
const entries = Object.entries(local);
if (entries.length === 0) return;
const remote = await fetchProgress(currentUser.id);
for (const [cardId, entry] of entries) {
if (!remote[cardId]) {
await saveProgressRow(currentUser.id, cardId, entry);
}
}
}

async function loadProgressForUser(currentUser) {
if (currentUser) {
await migrateLocalProgress(currentUser);
const remote = await fetchProgress(currentUser.id);
setProgressState(remote);
setSetLastStudied(await fetchSetLastStudied(currentUser.id));
} else {
setProgressState(loadFromStorage(STORAGE_KEYS.PROGRESS, {}));
setSetLastStudied({});
}
}

useEffect(() => {
loadCards();
loadSets();

supabase.auth.getSession().then(async ({ data: { session } }) => {
const u = session?.user ?? null;
setUser(u);
await checkAdmin(u);
await loadProgressForUser(u);
setAuthLoading(false);
});

const { data: listener } = supabase.auth.onAuthStateChange(async (_event, session) => {
const u = session?.user ?? null;
const wasUser = userRef.current;
setUser(u);
await checkAdmin(u);
// Only reload progress on an actual sign-in/sign-out transition, not
// on token refreshes for the same user.
if ((wasUser?.id ?? null) !== (u?.id ?? null)) {
await loadProgressForUser(u);
}
});

return () => listener.subscription.unsubscribe();
}, []);

// Guests: keep localStorage in sync. Signed-in users are written through
// to Supabase directly in setProgress below, so this is a no-op for them.
useEffect(() => {
if (!user) saveToStorage(STORAGE_KEYS.PROGRESS, progress);
}, [progress, user]);

// Wraps setProgress so a single card update also gets persisted --
// components call this the same way they'd call a plain setState.
function setProgress(updaterOrValue, cardId, entry) {
setProgressState(updaterOrValue);
if (user && cardId !== undefined && entry !== undefined) {
saveProgressRow(user.id, cardId, entry);
}
}

function startStudy(mode) {
let selected = [...cards];
let title = 'Study All';
if (mode === 'shuffle') {
selected = selected.sort(() => Math.random() - 0.5);
title = 'Shuffle Mode';
}
setActiveSetId(null);
setStudyCards(selected);
setStudyTitle(title);
setScreen('study');
}

function startMissed() {
const missed = cards.filter(c => progress[c.id]?.lastQuality < 2);
setActiveSetId(null);
setStudyCards(missed);
setStudyTitle('Missed Cards Review');
setScreen('study');
}

function startSpaced() {
const now = Date.now();
const due = cards.filter(c => {
const p = progress[c.id];
return p && p.nextReview && p.nextReview <= now;
});
setActiveSetId(null);
setStudyCards(due);
setStudyTitle('Spaced Review');
setScreen('study');
}

async function resetProgress() {
setProgressState({});
setShowReset(false);
if (user) {
await clearProgressRows(user.id);
} else {
saveToStorage(STORAGE_KEYS.PROGRESS, {});
}
}

function openSet(set) {
setActiveSet(set);
setScreen('set-detail');
}

function touchSetStudied(setId) {
if (!user) return;
const now = new Date().toISOString();
setSetLastStudied(prev => ({ ...prev, [setId]: now }));
touchSetLastStudied(user.id, setId);
}

function startSetStudy(set, setCards) {
setActiveSetId(set.id);
setStudyCards(setCards);
setStudyTitle(set.name);
setStudyKey(k => k + 1);
setScreen('study');
touchSetStudied(set.id);
}

function startSetQuiz(set, setCards) {
setActiveSetId(set.id);
setStudyCards([...setCards].sort(() => Math.random() - 0.5));
setScreen('quiz');
touchSetStudied(set.id);
}

return (
<div style={{minHeight:'100vh'}}>
<nav className="nav">
<div className="nav-title" style={{cursor:'pointer'}} onClick={() => { setScreen('home'); loadCards(); }}>📚 Flashcards</div>
<div style={{display:'flex', gap:8, alignItems:'center'}}>
{screen === 'home' && (
<button className="btn btn-outline btn-sm" onClick={() => setShowReset(true)} title="Reset progress">
Reset Progress
</button>
)}
{!authLoading && (
<AuthControl user={user} isAdmin={isAdmin} onSignedOut={() => setScreen('home')} />
)}
</div>
</nav>

{screen === 'home' && (
<HomeScreen
cards={cards}
sets={sets}
progress={progress}
loading={loading}
isAdmin={isAdmin}
onStartStudy={startStudy}
onStartMissed={startMissed}
onStartQuiz={() => { setActiveSetId(null); setStudyCards([...cards].sort(() => Math.random() - 0.5)); setScreen('quiz'); }}
onStartSpaced={startSpaced}
onAdmin={() => setScreen('admin')}
onSets={() => { loadSets(); setScreen('sets'); }}
/>
)}

{screen === 'sets' && (
<SetsScreen
sets={sets}
cards={cards}
lastStudied={setLastStudied}
loading={false}
onBack={() => setScreen('home')}
onOpenSet={openSet}
/>
)}

{screen === 'set-detail' && activeSet && (
<SetDetailScreen
set={activeSet}
cards={cards}
progress={progress}
user={user}
onBack={() => setScreen('sets')}
onStudy={(setCards) => startSetStudy(activeSet, setCards)}
onTest={(setCards) => startSetQuiz(activeSet, setCards)}
/>
)}

{screen === 'study' && (
<StudyScreen
cards={studyCards}
progress={progress}
setProgress={setProgress}
onBack={() => { setScreen(activeSetId ? 'set-detail' : 'home'); loadCards(); }}
key={studyKey}
onStartSubset={(subset, subTitle) => { setStudyCards(subset); setStudyTitle(subTitle); setStudyKey(k => k + 1); }}
title={studyTitle}
/>
)}

{screen === 'quiz' && (
<QuizScreen
cards={studyCards}
progress={progress}
setProgress={setProgress}
onBack={() => { setScreen(activeSetId ? 'set-detail' : 'home'); loadCards(); }}
setId={activeSetId}
user={user}
label={activeSetId ? `Testing: ${activeSet?.name || ''}` : 'Quiz Mode'}
/>
)}

{screen === 'admin' && (
<AdminPanel
cards={cards}
setCards={setCards}
sets={sets}
setSets={setSets}
refreshSets={loadSets}
onBack={() => { setScreen('home'); loadCards(); loadSets(); }}
refreshCards={loadCards}
isAdmin={isAdmin}
/>
)}

{showReset && <ResetConfirm onConfirm={resetProgress} onCancel={() => setShowReset(false)} />}
</div>
);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
